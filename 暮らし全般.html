<!DOCTYPE html>

	  <style>
		  .water-card {
			  display: grid;

			  background: #e0f4ff;
			  border-radius: 10px;
			  padding: 10px;
			  width: 480px;
			  font-family: sans-serif;

		  }
		  .icon {
			  font-size: 2.5em;
			  font-weight: bold;
			  text-shadow: 
				  2px 2px 3px rgba(255,255,255,0.8),
				  -2px -2px 3px rgba(255,255,255,0.8);
		  }
		  .right {
			  background: white;
			  border-radius: 8px;
			  padding: 10px;
			  font-size: 0.9em;
			  color: #333;
		  }
		  .right a {
			  color: #0066aa;
			  text-decoration: none;
		  }
		  .right a:hover {
			  text-decoration: underline;
		  }
	  </style>
