	  <style>
		/* ページ離脱時のフェードアウト */
		.fade-out {
			opacity: 0;
			transition: opacity 0.8s ease;
		}
	    body {
			/* フォント */
			font-family: 'HG丸ｺﾞｼｯｸM-PRO', 'HGMaruGothicMPRO', sans-serif;
			/* 背景色   */
			background-color: lightblue;
			/* マウスポインター */
			cursor: url("画_カニ.png"), auto;
			/* ページ切り替え（読み込み時のフェードイン） */
			opacity: 0;
  			animation: fadeIn 0.8s ease forwards;	
	    }
		@keyframes fadeIn {
			to { opacity: 1; }
		}
		  /* リンクの上でも同じカーソルにする */
		  a {
			  cursor: url("画_カニ.png"), auto;
		  }
		  /* リンクホバー時（蛍光ペン） */
		  a:hover {
			  background-color: yellow;
		  }
		  p {
			  line-height: 1.6;
		  }
		  
		  /* 行全体のホバー反応 */
		  .pref-row {
			  padding: 2px 4px;
			  transition: background-color .3s ease;
		  }
		  /* 行にホバーしたら背景がふわっと */
		  .pref-row:hover {
			  background-color: rgba(28, 180, 211, 0.15);
		  }
		  /* 都道府県名 */
		  .pref-row .pref {
			  color: #1cb4d3;				/*都道府県名の文字色：夏っぽい水色(シアン)*/
			  font-weight: bold;			/*太字*/
			  text-decoration: none;		/*下線削除*/
			  transition: background-color .5s, color .5s;
			  padding: 2px 4px;
			  border-radius: 4px;
		  }
		  /* 行にホバーした時だけ、都道府県名が色反転 */
		  .pref-row:hover .pref {
			  background-color: #1cb4d3;	/*都道府県名の背景色：夏っぽい水色(シアン)*/
			  font-weight: bold;			/*太字*/
			  color: #fff;					/*文字色：白*/
			  text-decoration: none;		/*下線削除*/
		  }
		  .region {
			  background-color: rgba(255, 255, 255, 0.6); /* 薄い白 */
			  padding: 8px 12px; 			/* 内側の余白 */
			  border-radius: 8px; 			/* 角丸 */
			  margin: 10px 0;				/* 上下の間隔 */
		  }

		  .links-list {
			  list-style: none;
			  padding: 0;
			  margin: 0;
		  }
		  .links-list li {

		  }

				このサイトは個人制作のリンクポータルです。

				各リンク先の内容・運営はリンク先各団体に帰属します。
			</small>
		</footer>
		
		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const links = document.querySelectorAll("a");
				links.forEach(link => {
					
					const url = link.getAttribute("href");
					
					// popover トリガーはフェードアウト処理を無視
					if (link.hasAttribute("popovertarget")) return;
					
					// 外部リンクは新しいタブで開く
					if (url && url.startsWith("http")) {
						link.target = "_blank";
						link.rel = "noopener noreferrer";
						return; // 外部リンクはフェードアウトしない
					}
					
					// 内部リンクだけフェードアウト
					link.addEventListener("click", e => {
						if (!url || url.startsWith("#")) return;
						e.preventDefault();
						document.body.classList.add("fade-out");
						setTimeout(() => {window.location = url;}, 500);
					});
				});
			});
		</script>
	</body>
